# dsh-codegraph bundle patch.
#
# This file is the `dsh.bundle.patch` layer of the package: installed through
#   dsh plugin --profile <name> add dsh-codegraph
# the command reconciles `dsh.profile.bundles` against installed packages and,
# seeing this declaration, appends `dsh-codegraph` to the bundle stack. The
# profile boot then merges this patch (a single `insert` of the plugin row)
# exactly like a manual cordis.patch.yml mount line.
- insert:
    - id: codegraph
      name: 'dsh-codegraph'
